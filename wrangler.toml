name = "ayoob-bakery"
compatibility_date = "2024-04-05"
compatibility_flags = [ "nodejs_compat" ]

# This ensures we can handle larger payloads (like product images) 
# and keep connections warm.
[limits]
cpu_ms = 50000

# Environment Variables
# WARNING: Do NOT put secrets here if this file is public.
# Use the Cloudflare Dashboard for secrets (MONGODB_URI, NEXTAUTH_SECRET).
[vars]
NEXTAUTH_URL = "http://localhost:3000" 